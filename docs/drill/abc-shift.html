<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アルファベットシフト - ナゾドリル</title>
    <meta name="description" content="アルファベットをずらして変換するトレーニング（A+1→B, Z-1→Y）">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-6 max-w-2xl">
        <!-- ヘッダー -->
        <header class="mb-6">
            <div class="flex items-center justify-between mb-4">
                <a href="../index.html" class="text-indigo-600 hover:text-indigo-800 flex items-center">
                    <span class="text-xl mr-2">←</span>
                    <span class="font-medium">トップへ戻る</span>
                </a>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold text-indigo-900 mb-2 text-center">
                🔠 アルファベットシフト
            </h1>
            <p class="text-center text-gray-700">
                アルファベットをずらして変換しよう
            </p>
        </header>

        <!-- 問題エリア -->
        <div class="bg-white rounded-lg shadow-lg p-8 mb-6">
            <!-- 問題表示 -->
            <div class="text-center mb-8">
                <div class="text-6xl md:text-7xl font-bold text-indigo-900" id="question-display">
                    --
                </div>
            </div>

            <!-- 回答入力＆ボタンエリア -->
            <div>
                <label for="answer-input" class="block text-sm font-medium text-gray-700 mb-2">
                    あなたの答え:
                </label>
                <div class="flex gap-2 items-stretch">
                    <input
                        type="text"
                        id="answer-input"
                        class="flex-1 text-center text-2xl md:text-3xl font-bold p-3 md:p-4 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 uppercase"
                        placeholder="A"
                        maxlength="1"
                        autocomplete="off"
                    >
                    <button
                        id="submit-button"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-5 md:py-4 md:px-8 rounded-lg transition-colors duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed whitespace-nowrap min-w-[80px] md:min-w-[120px]">
                        <span class="text-lg md:text-xl">→</span>
                    </button>
                    <button
                        id="next-button"
                        class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-5 md:py-4 md:px-8 rounded-lg transition-colors duration-200 hidden whitespace-nowrap min-w-[80px] md:min-w-[120px]">
                        <span class="text-lg md:text-xl">→</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- フィードバックエリア -->
        <div id="feedback" class="hidden rounded-lg p-4 mb-6 text-center font-bold text-lg"></div>

        <!-- ヒント -->
        <div class="bg-blue-50 border-l-4 border-blue-400 p-4 mb-6">
            <div class="flex">
                <div class="text-2xl mr-3">💡</div>
                <div>
                    <p class="font-bold text-blue-800 mb-1">変換ルール</p>
                    <p class="text-sm text-blue-700">
                        A+1→B, B+2→D, C-1→B のように、アルファベットをずらします<br>
                        シフトは-5〜+5の範囲で、循環する問題は出題されません
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- スクリプト -->
    <script src="../js/common.js"></script>
    <script src="../js/drill-controller.js"></script>
    <script src="../js/abc-shift.js"></script>
    <script>
        // ドリルを初期化
        const drill = new AlphaShiftDrill();
        const controller = new DrillController(drill, {
            autoUppercase: true,
            maxLength: 1,
            placeholder: 'A'
        });
    </script>
</body>
</html>
