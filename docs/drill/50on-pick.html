<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五十音表の文字拾い - ナゾドリル</title>
    <meta name="description" content="五十音表のマークされたマスから文字を読み取るトレーニング">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --chalkboard: #2a3d2e;
            --chalkboard-light: #3a5240;
            --wood-frame: #5c3d2e;
            --wood-light: #7a5240;
            --chalk-white: #f0ebe3;
            --chalk-yellow: #fff8dc;
            --red-pen: #e85a5a;
            --blue-pen: #6ba3d6;
        }

        * {
            font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic Pro', 'BIZ UDGothic', sans-serif;
        }

        body {
            background-color: var(--chalkboard);
            position: relative;
        }

        /* 黒板のノイズテクスチャ */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
        }

        .chalk-text {
            color: var(--chalk-white);
            text-shadow: 0 0 1px rgba(240, 235, 227, 0.5), 1px 1px 0 rgba(0, 0, 0, 0.1);
        }

        .chalk-yellow {
            color: var(--chalk-yellow);
            text-shadow: 0 0 1px rgba(255, 248, 220, 0.5), 1px 1px 0 rgba(0, 0, 0, 0.1);
        }

        .red-accent { color: var(--red-pen); }
        .blue-link { color: var(--blue-pen); }
        .blue-link:hover { opacity: 0.8; }

        /* 木枠風パネル */
        .wood-panel {
            background: linear-gradient(145deg, var(--chalkboard-light), var(--chalkboard));
            border: 4px solid var(--wood-frame);
            border-radius: 4px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2), 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        /* チョーク風ボタン */
        .chalk-btn {
            background: transparent;
            border: 2px dashed var(--chalk-white);
            color: var(--chalk-white);
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .chalk-btn:hover {
            background: rgba(240, 235, 227, 0.1);
            border-style: solid;
        }

        /* 送信ボタン */
        .submit-btn {
            background: var(--blue-pen);
            color: white;
            border: none;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .submit-btn:hover { opacity: 0.9; }
        .submit-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        /* 次へボタン */
        .next-btn {
            background: var(--red-pen);
            color: white;
            border: none;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .next-btn:hover { opacity: 0.9; }

        /* 入力フィールド */
        .chalk-input {
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(240, 235, 227, 0.4);
            color: var(--chalk-yellow);
            border-radius: 8px;
        }
        .chalk-input:focus {
            outline: none;
            border-color: var(--chalk-yellow);
            background: rgba(0, 0, 0, 0.3);
        }
        .chalk-input::placeholder {
            color: rgba(240, 235, 227, 0.4);
        }

        /* 五十音表 */
        .gojuon-cell {
            width: 2rem;
            height: 2rem;
            border: 1px solid rgba(240, 235, 227, 0.3);
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            color: var(--chalk-yellow);
            background-color: transparent;
        }
        .gojuon-cell.empty-cell {
            background-color: rgba(0, 0, 0, 0.3);
        }
        .gojuon-cell.marked {
            background-color: rgba(232, 90, 90, 0.3);
            border-color: var(--red-pen);
        }
        /* 「は」列の左右の線を太く */
        .gojuon-cell[data-col="5"] {
            border-left: 2px solid rgba(240, 235, 227, 0.5);
            border-right: 2px solid rgba(240, 235, 227, 0.5);
        }
        @media (min-width: 640px) {
            .gojuon-cell {
                width: 2.5rem;
                height: 2.5rem;
                font-size: 1.25rem;
            }
        }

        /* 例用の小さな五十音表 */
        .example-cell {
            width: 1.25rem;
            height: 1.25rem;
            border: 1px solid rgba(240, 235, 227, 0.3);
            text-align: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--chalk-yellow);
            background-color: transparent;
        }
        .example-cell.example-empty {
            background-color: rgba(0, 0, 0, 0.3);
        }
        .example-cell.example-marked {
            background-color: rgba(232, 90, 90, 0.3);
            border-color: var(--red-pen);
        }

        /* フィードバック */
        .feedback-correct {
            background: rgba(232, 90, 90, 0.2);
            border: 2px solid var(--red-pen);
            color: var(--red-pen);
        }
        .feedback-incorrect {
            background: rgba(107, 163, 214, 0.2);
            border: 2px solid var(--blue-pen);
            color: var(--blue-pen);
        }
    </style>
</head>

            </div>
            <h1 class="text-3xl md:text-4xl font-bold chalk-yellow mb-2 text-center">

    <script>
        // 五十音表を更新する関数
        function updateGojuonTable(question) {
            const markedCells = JSON.parse(question.question);
            const cells = document.querySelectorAll('.gojuon-cell');

            // すべてのセルをリセット
            cells.forEach(cell => {
                cell.classList.remove('marked');
                cell.textContent = '';
            });

            // マークされたセルに数字のみ表示
            markedCells.forEach(({ row, col, number }) => {
                const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                if (cell) {
                    cell.classList.add('marked');
                    cell.textContent = number;
                }
            });
        }

        // ドリルを初期化
        const drill = new GojuonPickDrill();
        const controller = new DrillController(drill, {
            autoUppercase: false,
            maxLength: 10,
            placeholder: 'ひらがなで入力',
            onQuestionDisplay: (question, element) => {
                updateGojuonTable(question);
            },
            getHintContent: (question, answer) => answer
        });
    </script>
