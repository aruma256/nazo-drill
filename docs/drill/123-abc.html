<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字toアルファベット - ナゾドリル</title>
    <meta name="description" content="数字をアルファベットに変換するトレーニング（1→A, 2→B, ...）">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-6 max-w-2xl">
        <!-- ヘッダー -->
        <header class="mb-6">
            <div class="flex items-center justify-between mb-4">
                <a href="../index.html" class="text-indigo-600 hover:text-indigo-800 flex items-center">
                    <span class="text-xl mr-2">←</span>
                    <span class="font-medium">トップへ戻る</span>
                </a>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold text-indigo-900 mb-2 text-center">
                🔢 数字toアルファベット
            </h1>
            <p class="text-center text-gray-700">
                数字をアルファベットに変換しよう
            </p>
        </header>

        <!-- 問題エリア -->
        <div class="bg-white rounded-lg shadow-lg p-8 mb-6">
            <!-- 数字グリッド -->
            <div class="mb-6">
                <div class="grid grid-cols-5 gap-1.5 max-w-md mx-auto">
                    <!-- 1-26の数字を5×6グリッドで表示 -->
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="1">1</div>
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="2">2</div>
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="3">3</div>
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="4">4</div>
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="5">5</div>

                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="6">6</div>
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="7">7</div>
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="8">8</div>
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="9">9</div>
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="10">10</div>

                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="11">11</div>
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="12">12</div>
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="13">13</div>
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="14">14</div>
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="15">15</div>

                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="16">16</div>
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="17">17</div>
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="18">18</div>
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="19">19</div>
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="20">20</div>

                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="21">21</div>
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="22">22</div>
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="23">23</div>
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="24">24</div>
                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="25">25</div>

                    <div class="h-10 border-2 border-gray-300 rounded flex items-center justify-center font-bold text-sm transition-all duration-200" data-number="26">26</div>
                </div>
            </div>

            <!-- 回答入力 -->
            <div class="mb-6">
                <label for="answer-input" class="block text-sm font-medium text-gray-700 mb-2">
                    あなたの答え:
                </label>
                <input
                    type="text"
                    id="answer-input"
                    class="w-full text-center text-3xl font-bold p-4 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 uppercase"
                    placeholder="A"
                    maxlength="1"
                    autocomplete="off"
                >
            </div>

            <!-- ボタンエリア -->
            <div class="flex gap-3">
                <button
                    id="submit-button"
                    class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-lg transition-colors duration-200 text-lg disabled:bg-gray-400 disabled:cursor-not-allowed">
                    回答する
                </button>
                <button
                    id="next-button"
                    class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-6 rounded-lg transition-colors duration-200 text-lg hidden">
                    次の問題
                </button>
            </div>
        </div>

        <!-- フィードバックエリア -->
        <div id="feedback" class="hidden rounded-lg p-4 mb-6 text-center font-bold text-lg"></div>

        <!-- ヒント -->
        <div class="bg-blue-50 border-l-4 border-blue-400 p-4 mb-6">
            <div class="flex">
                <div class="text-2xl mr-3">💡</div>
                <div>
                    <p class="font-bold text-blue-800 mb-1">変換ルール</p>
                    <p class="text-sm text-blue-700">
                        1→A, 2→B, 3→C, 4→D, 5→E ... 26→Z
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- スクリプト -->
    <script src="../js/common.js"></script>
    <script src="../js/drill-controller.js"></script>
    <script src="../js/123-abc.js"></script>
    <script>
        // DrillControllerが期待するquestion-display要素のダミーを作成
        // （問題表示は不要だがエラー回避のため）
        const dummyQuestionDisplay = document.createElement('div');
        dummyQuestionDisplay.id = 'question-display';
        dummyQuestionDisplay.style.display = 'none';
        document.body.appendChild(dummyQuestionDisplay);

        // ドリルを初期化
        const drill = new NumberToAlphaDrill();
        const controller = new DrillController(drill, {
            autoUppercase: true,
            maxLength: 1,
            placeholder: 'A'
        });

        // グリッドのハイライト機能とアルファベット表示機能を追加
        const originalPresentNewQuestion = controller.presentNewQuestion.bind(controller);
        controller.presentNewQuestion = function() {
            showNumbersOnGrid(); // 数字表示に戻す
            originalPresentNewQuestion();
            highlightCurrentNumber();
        };

        const originalSubmitAnswer = controller.submitAnswer.bind(controller);
        controller.submitAnswer = function() {
            // 回答前に正誤判定を行う
            const userAnswer = controller.elements.answerInput.value.trim();
            const isCorrect = controller.drill.checkAnswer(userAnswer);

            originalSubmitAnswer();
            showAlphabetOnGrid(); // アルファベット表示に切り替え
            showAnswerFeedbackOnGrid(isCorrect); // 正誤に応じて色を変える
        };

        /**
         * 現在の問題番号に対応するセルをハイライトする
         */
        function highlightCurrentNumber() {
            // すべてのセルのハイライトをリセット
            const allCells = document.querySelectorAll('[data-number]');
            allCells.forEach(cell => {
                cell.classList.remove(
                    'bg-indigo-500', 'text-white', 'border-indigo-600', 'scale-110',
                    'bg-green-500', 'border-green-600',
                    'bg-red-500', 'border-red-600'
                );
                cell.classList.add('border-gray-300');
            });

            // 現在の問題番号を取得
            const currentNumber = controller.drill.currentQuestion.question;

            // 対応するセルをハイライト
            const targetCell = document.querySelector(`[data-number="${currentNumber}"]`);
            if (targetCell) {
                targetCell.classList.remove('border-gray-300');
                targetCell.classList.add('bg-indigo-500', 'text-white', 'border-indigo-600', 'scale-110');
            }
        }

        /**
         * 回答の正誤に応じてセルの色を変える
         * @param {boolean} isCorrect - 正解ならtrue、不正解ならfalse
         */
        function showAnswerFeedbackOnGrid(isCorrect) {
            const currentNumber = controller.drill.currentQuestion.question;
            const targetCell = document.querySelector(`[data-number="${currentNumber}"]`);

            if (targetCell) {
                // 既存のハイライトを削除
                targetCell.classList.remove('bg-indigo-500', 'border-indigo-600');

                // 正誤に応じて色を追加
                if (isCorrect) {
                    targetCell.classList.add('bg-green-500', 'border-green-600');
                } else {
                    targetCell.classList.add('bg-red-500', 'border-red-600');
                }
            }
        }

        /**
         * グリッドのすべてのセルをアルファベット表示に切り替える
         */
        function showAlphabetOnGrid() {
            const allCells = document.querySelectorAll('[data-number]');
            allCells.forEach(cell => {
                const number = parseInt(cell.getAttribute('data-number'));
                const alphabet = String.fromCharCode(64 + number); // 1→A, 2→B, ...
                cell.textContent = alphabet;
            });
        }

        /**
         * グリッドのすべてのセルを数字表示に戻す
         */
        function showNumbersOnGrid() {
            const allCells = document.querySelectorAll('[data-number]');
            allCells.forEach(cell => {
                const number = cell.getAttribute('data-number');
                cell.textContent = number;
            });
        }

        // 初回のハイライト表示
        highlightCurrentNumber();
    </script>
</body>
</html>
