<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字toアルファベット - ナゾドリル</title>
    <meta name="description" content="数字をアルファベットに変換するトレーニング（1→A, 2→B, ...）">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div id="main-container" class="container mx-auto px-4 py-6 max-w-2xl">
        <!-- ヘッダー（ドリル中は非表示） -->
        <header id="header" class="mb-6">
            <div class="flex items-center justify-between mb-4">
                <a href="../index.html" class="text-indigo-600 hover:text-indigo-800 flex items-center">
                    <span class="text-xl mr-2">←</span>
                    <span class="font-medium">トップへ戻る</span>
                </a>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold text-indigo-900 mb-2 text-center">
                数字toアルファベット
            </h1>
            <p class="text-center text-gray-700">
                数字をアルファベットに変換しよう
            </p>
        </header>

        <!-- スタート画面 -->
        <div id="start-screen">
            <!-- ルール説明（影なしフラットデザイン） -->
            <section class="mb-8">
                <h2 class="text-lg font-bold text-indigo-900 mb-3 flex items-center">
                    <span class="w-1 h-5 bg-indigo-500 rounded mr-2"></span>
                    ルール
                </h2>
                <div class="text-gray-700 space-y-2 pl-3">
                    <p>数字をアルファベットに変換して答えます。</p>
                    <div class="bg-white/50 rounded-lg p-3 text-center mt-3">
                        <p class="text-lg font-mono">
                            <span class="text-indigo-600">1</span> → <span class="text-green-600 font-bold">A</span>
                        </p>
                        <p class="text-lg font-mono">
                            <span class="text-indigo-600">5</span> → <span class="text-green-600 font-bold">E</span>
                        </p>
                        <p class="text-lg font-mono">
                            <span class="text-indigo-600">26</span> → <span class="text-green-600 font-bold">Z</span>
                        </p>
                    </div>
                    <p class="text-sm text-gray-500 mt-2">参照表を見ながら位置で覚えましょう</p>
                </div>
            </section>

            <!-- モード選択（ボタンをカードスタイルに） -->
            <section class="mb-6">
                <h2 class="text-lg font-bold text-indigo-900 mb-3 flex items-center">
                    <span class="w-1 h-5 bg-indigo-500 rounded mr-2"></span>
                    モードを選択
                </h2>
                <div class="space-y-3">
                    <button
                        data-mode="ejoty"
                        class="w-full py-4 px-6 bg-white hover:bg-indigo-50 text-indigo-700 font-bold rounded-lg shadow-md hover:shadow-lg transition-all duration-200 text-lg border-2 border-transparent hover:border-indigo-400">
                        "EJOTY"特訓モード
                    </button>
                    <button
                        data-mode="single"
                        class="w-full py-4 px-6 bg-white hover:bg-indigo-50 text-indigo-700 font-bold rounded-lg shadow-md hover:shadow-lg transition-all duration-200 text-lg border-2 border-transparent hover:border-indigo-400">
                        1文字モード
                    </button>
                    <button
                        data-mode="word"
                        class="w-full py-4 px-6 bg-white hover:bg-indigo-50 text-indigo-700 font-bold rounded-lg shadow-md hover:shadow-lg transition-all duration-200 text-lg border-2 border-transparent hover:border-indigo-400">
                        単語モード
                    </button>
                </div>
            </section>
        </div>

        <!-- ドリル画面（スマホ最適化：スクロール不要レイアウト） -->
        <div id="drill-screen" class="hidden">
            <!-- スマホ用ミニヘッダー（戻るボタンのみ） -->
            <div class="flex items-center justify-between mb-2">
                <button id="back-to-start" class="text-indigo-600 hover:text-indigo-800 flex items-center text-sm">
                    <span class="mr-1">←</span>
                    <span>やめる</span>
                </button>
                <span class="text-sm text-gray-500">数字→ABC</span>
            </div>

            <!-- 問題エリア（影なしフラットデザイン） -->
            <div class="bg-white/70 rounded-lg p-4">
                <!-- 問題表示 -->
                <div class="text-center mb-4">
                    <div class="text-5xl font-bold text-indigo-900" id="question-display">
                        --
                    </div>
                </div>

                <!-- EJOTY特訓モード用ヒントメッセージ -->
                <div id="ejoty-hint" class="hidden mb-4 text-center">
                    <div class="bg-amber-50 border border-amber-200 rounded-lg p-3">
                        <p class="text-amber-800 font-medium">
                            E, J, O, T, Y = 5, 10, 15, 20, 25
                        </p>
                        <p class="text-amber-600 text-sm mt-1">
                            5の倍数だけ覚えよう
                        </p>
                    </div>
                </div>

                <!-- アルファベット参照表（EJOTYのみ表示） -->
                <div id="alpha-table" class="mb-4 flex justify-center">
                    <table class="border-collapse border border-gray-300">
                        <tbody>
                            <tr>
                                <td class="alpha-cell"></td>
                                <td class="alpha-cell"></td>
                                <td class="alpha-cell"></td>
                                <td class="alpha-cell"></td>
                                <td class="alpha-cell ejoty">E</td>
                            </tr>
                            <tr>
                                <td class="alpha-cell"></td>
                                <td class="alpha-cell"></td>
                                <td class="alpha-cell"></td>
                                <td class="alpha-cell"></td>
                                <td class="alpha-cell ejoty">J</td>
                            </tr>
                            <tr>
                                <td class="alpha-cell"></td>
                                <td class="alpha-cell"></td>
                                <td class="alpha-cell"></td>
                                <td class="alpha-cell"></td>
                                <td class="alpha-cell ejoty">O</td>
                            </tr>
                            <tr>
                                <td class="alpha-cell"></td>
                                <td class="alpha-cell"></td>
                                <td class="alpha-cell"></td>
                                <td class="alpha-cell"></td>
                                <td class="alpha-cell ejoty">T</td>
                            </tr>
                            <tr>
                                <td class="alpha-cell"></td>
                                <td class="alpha-cell"></td>
                                <td class="alpha-cell"></td>
                                <td class="alpha-cell"></td>
                                <td class="alpha-cell ejoty">Y</td>
                            </tr>
                            <tr>
                                <td class="alpha-cell">Z</td>
                                <td class="alpha-cell empty"></td>
                                <td class="alpha-cell empty"></td>
                                <td class="alpha-cell empty"></td>
                                <td class="alpha-cell empty"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 回答入力＆ボタンエリア -->
                <div class="mb-2">
                    <label for="answer-input" class="sr-only">
                        あなたの答え:
                    </label>
                    <div class="flex gap-2 items-stretch">
                        <input
                            type="text"
                            id="answer-input"
                            class="flex-1 min-w-0 text-center text-2xl font-bold p-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 uppercase"
                            autocomplete="off"
                        >
                        <button
                            id="submit-button"
                            class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-5 rounded-lg transition-colors duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed whitespace-nowrap min-w-[80px]">
                            <span class="text-lg">➤</span>
                        </button>
                        <button
                            id="next-button"
                            class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-5 rounded-lg transition-colors duration-200 hidden whitespace-nowrap min-w-[80px]">
                            <span class="text-lg">→</span>
                        </button>
                    </div>
                </div>

                <!-- フィードバックエリア（インライン表示） -->
                <div id="feedback" class="hidden rounded-lg p-2 text-center font-bold"></div>
            </div>

            <!-- ヒント（ドリル中は非表示） -->
            <div id="hint" class="hidden bg-blue-50 border-l-4 border-blue-400 p-4 mt-4">
                <div class="flex">
                    <div class="text-2xl mr-3">💡</div>
                    <div>
                        <p class="font-bold text-blue-800 mb-1">変換ルール</p>
                        <p class="text-sm text-blue-700">
                            1→A, 2→B, 3→C, 4→D, 5→E ... 26→Z<br>
                            参照表を見ながら位置で覚えましょう
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- フィードバックモーダル -->
    <div id="feedback-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
        <div class="absolute inset-0 bg-black/20"></div>
        <div class="relative bg-white rounded-2xl shadow-2xl p-8 mx-4 max-w-sm w-full text-center">
            <div id="modal-message" class="text-3xl font-bold mb-4"></div>
            <div id="modal-hint" class="hidden text-xl text-indigo-900 mb-4"></div>
            <div class="text-sm text-gray-400 mt-6">タップして次へ</div>
        </div>
    </div>

    <style>
        .alpha-cell {
            height: 1.75rem;
            width: 3rem;
            border: 1px solid #d1d5db;
            text-align: center;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            background-color: #fff;
        }
        .alpha-cell.ejoty {
            font-weight: 700;
            color: #4f46e5;
            background-color: #eef2ff;
        }
        .alpha-cell.empty {
            background-color: transparent;
            border-color: transparent;
        }
        @media (min-width: 640px) {
            .alpha-cell {
                height: 2rem;
                width: 3.5rem;
                font-size: 1rem;
            }
        }
    </style>

    <!-- スクリプト -->
    <script src="../js/common.js"></script>
    <script src="../js/drill-controller.js"></script>
    <script src="../js/words-123-abc.js"></script>
    <script src="../js/123-abc.js"></script>
    <script>
        // モードに応じてUIを調整
        function updateUIForMode(mode) {
            const alphaTable = document.getElementById('alpha-table');
            const ejotyHint = document.getElementById('ejoty-hint');

            if (mode === 'ejoty') {
                // EJOTY特訓モード：表なし、ヒントメッセージ表示
                alphaTable.classList.add('hidden');
                ejotyHint.classList.remove('hidden');
            } else {
                // 1文字・単語モード：表あり（EJOTYのみ）
                alphaTable.classList.remove('hidden');
                ejotyHint.classList.add('hidden');
            }
        }

        // ドリルを初期化
        const drill = new NumberToAlphaDrill();
        const controller = new DrillController(drill, {
            autoUppercase: true,
            maxLength: 10,
            placeholder: '答えを入力',
            getHintContent: (question, answer) => `${answer} = ${question}`
        });

        // モード選択時にUIを更新
        const originalSelectMode = controller.selectMode.bind(controller);
        controller.selectMode = function(mode) {
            originalSelectMode(mode);
            updateUIForMode(mode);
        };
    </script>
</body>
</html>
