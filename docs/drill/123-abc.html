<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字toアルファベット - ナゾドリル</title>
    <meta name="description" content="数字をアルファベットに変換するトレーニング（1→A, 2→B, ...）">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-6 max-w-2xl">
        <!-- ヘッダー -->
        <header class="mb-6">
            <div class="flex items-center justify-between mb-4">
                <a href="../index.html" class="text-indigo-600 hover:text-indigo-800 flex items-center">
                    <span class="text-xl mr-2">←</span>
                    <span class="font-medium">トップへ戻る</span>
                </a>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold text-indigo-900 mb-2 text-center">
                🔢 数字toアルファベット
            </h1>
            <p class="text-center text-gray-700">
                数字をアルファベットに変換しよう
            </p>
        </header>

        <!-- 問題エリア -->
        <div class="bg-white rounded-lg shadow-lg p-8 mb-6">
            <!-- 問題表示 -->
            <div class="text-center mb-8">
                <div class="text-6xl md:text-7xl font-bold text-indigo-900" id="question-display">
                    --
                </div>
            </div>

            <!-- アルファベット参照表 -->
            <div class="mb-6 flex justify-center">
                <table class="border-collapse border border-gray-300 max-w-md">
                    <tbody>
                        <tr>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">A</td>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">B</td>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">C</td>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">D</td>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">E</td>
                        </tr>
                        <tr>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">F</td>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">G</td>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">H</td>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">I</td>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">J</td>
                        </tr>
                        <tr>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">K</td>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">L</td>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">M</td>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">N</td>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">O</td>
                        </tr>
                        <tr>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">P</td>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">Q</td>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">R</td>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">S</td>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">T</td>
                        </tr>
                        <tr>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">U</td>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">V</td>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">W</td>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">X</td>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">Y</td>
                        </tr>
                        <tr>
                            <td class="h-8 w-16 border border-gray-300 text-center text-sm font-medium text-gray-700">Z</td>
                            <td class="h-8 w-16 border border-transparent"></td>
                            <td class="h-8 w-16 border border-transparent"></td>
                            <td class="h-8 w-16 border border-transparent"></td>
                            <td class="h-8 w-16 border border-transparent"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 回答入力＆ボタンエリア -->
            <div>
                <label for="answer-input" class="sr-only">
                    あなたの答え:
                </label>
                <div class="flex gap-2 items-stretch">
                    <input
                        type="text"
                        id="answer-input"
                        class="flex-1 text-center text-2xl md:text-3xl font-bold p-3 md:p-4 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 uppercase"
                        placeholder="答えを入力"
                        maxlength="1"
                        autocomplete="off"
                    >
                    <button
                        id="submit-button"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-5 md:py-4 md:px-8 rounded-lg transition-colors duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed whitespace-nowrap min-w-[80px] md:min-w-[120px]">
                        <span class="text-lg md:text-xl">→</span>
                    </button>
                    <button
                        id="next-button"
                        class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-5 md:py-4 md:px-8 rounded-lg transition-colors duration-200 hidden whitespace-nowrap min-w-[80px] md:min-w-[120px]">
                        <span class="text-lg md:text-xl">→</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- フィードバックエリア -->
        <div id="feedback" class="hidden rounded-lg p-4 mb-6 text-center font-bold text-lg"></div>

        <!-- ヒント -->
        <div class="bg-blue-50 border-l-4 border-blue-400 p-4 mb-6">
            <div class="flex">
                <div class="text-2xl mr-3">💡</div>
                <div>
                    <p class="font-bold text-blue-800 mb-1">変換ルール</p>
                    <p class="text-sm text-blue-700">
                        1→A, 2→B, 3→C, 4→D, 5→E ... 26→Z<br>
                        参照表を見ながら位置で覚えましょう
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- スクリプト -->
    <script src="../js/common.js"></script>
    <script src="../js/drill-controller.js"></script>
    <script src="../js/123-abc.js"></script>
    <script>
        // ドリルを初期化
        const drill = new NumberToAlphaDrill();
        const controller = new DrillController(drill, {
            autoUppercase: true,
            maxLength: 1,
            placeholder: '答えを入力'
        });
    </script>
</body>
</html>
