<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字toアルファベット - ナゾドリル</title>
    <meta name="description" content="数字をアルファベットに変換するトレーニング（1→A, 2→B, ...）">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-6 max-w-2xl">
        <!-- ヘッダー -->
        <header class="mb-6">
            <div class="flex items-center justify-between mb-4">
                <a href="../index.html" class="text-indigo-600 hover:text-indigo-800 flex items-center">
                    <span class="text-xl mr-2">←</span>
                    <span class="font-medium">トップへ戻る</span>
                </a>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold text-indigo-900 mb-2 text-center">
                🔢 数字toアルファベット
            </h1>
            <p class="text-center text-gray-700">
                数字をアルファベットに変換しよう
            </p>
        </header>

        <!-- 問題エリア -->
        <div class="bg-white rounded-lg shadow-lg p-8 mb-6">
            <!-- 問題表示 -->
            <div class="text-center mb-8">
                <div class="text-6xl md:text-7xl font-bold text-indigo-900" id="question-display">
                    --
                </div>
            </div>

            <!-- アルファベット参照表 -->
            <div class="mb-6">
                <div class="grid grid-cols-5 gap-0 max-w-md mx-auto border border-gray-300">
                    <!-- A-Zのアルファベットを5×6グリッドで表示（マージンなし） -->
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">A</div>
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">B</div>
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">C</div>
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">D</div>
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">E</div>

                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">F</div>
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">G</div>
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">H</div>
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">I</div>
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">J</div>

                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">K</div>
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">L</div>
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">M</div>
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">N</div>
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">O</div>

                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">P</div>
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">Q</div>
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">R</div>
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">S</div>
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">T</div>

                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">U</div>
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">V</div>
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">W</div>
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">X</div>
                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">Y</div>

                    <div class="h-8 border border-gray-300 flex items-center justify-center text-sm font-medium text-gray-700">Z</div>
                </div>
            </div>

            <!-- 回答入力 -->
            <div class="mb-6">
                <label for="answer-input" class="block text-sm font-medium text-gray-700 mb-2">
                    あなたの答え:
                </label>
                <input
                    type="text"
                    id="answer-input"
                    class="w-full text-center text-3xl font-bold p-4 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 uppercase"
                    placeholder="A"
                    maxlength="1"
                    autocomplete="off"
                >
            </div>

            <!-- ボタンエリア -->
            <div class="flex gap-3">
                <button
                    id="submit-button"
                    class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-lg transition-colors duration-200 text-lg disabled:bg-gray-400 disabled:cursor-not-allowed">
                    回答する
                </button>
                <button
                    id="next-button"
                    class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-6 rounded-lg transition-colors duration-200 text-lg hidden">
                    次の問題
                </button>
            </div>
        </div>

        <!-- フィードバックエリア -->
        <div id="feedback" class="hidden rounded-lg p-4 mb-6 text-center font-bold text-lg"></div>

        <!-- ヒント -->
        <div class="bg-blue-50 border-l-4 border-blue-400 p-4 mb-6">
            <div class="flex">
                <div class="text-2xl mr-3">💡</div>
                <div>
                    <p class="font-bold text-blue-800 mb-1">変換ルール</p>
                    <p class="text-sm text-blue-700">
                        1→A, 2→B, 3→C, 4→D, 5→E ... 26→Z<br>
                        参照表を見ながら位置で覚えましょう
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- スクリプト -->
    <script src="../js/common.js"></script>
    <script src="../js/drill-controller.js"></script>
    <script src="../js/123-abc.js"></script>
    <script>
        // ドリルを初期化
        const drill = new NumberToAlphaDrill();
        const controller = new DrillController(drill, {
            autoUppercase: true,
            maxLength: 1,
            placeholder: 'A'
        });
    </script>
</body>
</html>
