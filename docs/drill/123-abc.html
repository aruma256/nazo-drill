<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字toアルファベット - ナゾドリル</title>
    <meta name="description" content="数字をアルファベットに変換するトレーニング（1→A, 2→B, ...）">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div id="main-container" class="container mx-auto px-4 py-6 max-w-2xl">
        <!-- ヘッダー（ドリル中は非表示） -->
        <header id="header" class="mb-6">
            <div class="flex items-center justify-between mb-4">
                <a href="../index.html" class="text-indigo-600 hover:text-indigo-800 flex items-center">
                    <span class="text-xl mr-2">←</span>
                    <span class="font-medium">トップへ戻る</span>
                </a>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold text-indigo-900 mb-2 text-center">
                🔢 数字toアルファベット
            </h1>
            <p class="text-center text-gray-700">
                数字をアルファベットに変換しよう
            </p>
        </header>

        <!-- スタート画面 -->
        <div id="start-screen">
            <!-- ルール説明 -->
            <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                <h2 class="text-xl font-bold text-indigo-900 mb-4">ルール</h2>
                <div class="text-gray-700 space-y-2">
                    <p>数字をアルファベットに変換して答えます。</p>
                    <div class="bg-gray-50 rounded p-3 text-center">
                        <p class="text-lg font-mono">
                            <span class="text-indigo-600">1</span> → <span class="text-green-600 font-bold">A</span>
                        </p>
                        <p class="text-lg font-mono">
                            <span class="text-indigo-600">5</span> → <span class="text-green-600 font-bold">E</span>
                        </p>
                        <p class="text-lg font-mono">
                            <span class="text-indigo-600">26</span> → <span class="text-green-600 font-bold">Z</span>
                        </p>
                    </div>
                    <p class="text-sm text-gray-500">参照表を見ながら位置で覚えましょう</p>
                </div>
            </div>

            <!-- モード選択 -->
            <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                <h2 class="text-xl font-bold text-indigo-900 mb-4">モードを選択</h2>
                <div class="space-y-3">
                    <button
                        data-mode="beginner"
                        class="w-full py-4 px-6 bg-green-500 hover:bg-green-600 text-white font-bold rounded-lg transition-colors duration-200 text-lg">
                        初級
                    </button>
                    <button
                        data-mode="intermediate"
                        data-disabled="true"
                        class="w-full py-4 px-6 bg-gray-300 text-gray-500 font-bold rounded-lg cursor-not-allowed text-lg">
                        中級（準備中）
                    </button>
                    <button
                        data-mode="advanced"
                        data-disabled="true"
                        class="w-full py-4 px-6 bg-gray-300 text-gray-500 font-bold rounded-lg cursor-not-allowed text-lg">
                        上級（準備中）
                    </button>
                </div>
            </div>
        </div>

        <!-- ドリル画面（スマホ最適化：スクロール不要レイアウト） -->
        <div id="drill-screen" class="hidden">
            <!-- スマホ用ミニヘッダー（戻るボタンのみ） -->
            <div class="flex items-center justify-between mb-2">
                <button id="back-to-start" class="text-indigo-600 hover:text-indigo-800 flex items-center text-sm">
                    <span class="mr-1">←</span>
                    <span>やめる</span>
                </button>
                <span class="text-sm text-gray-500">数字→ABC</span>
            </div>

            <!-- 問題エリア（コンパクト化） -->
            <div class="bg-white rounded-lg shadow-lg p-4">
                <!-- 問題表示 -->
                <div class="text-center mb-4">
                    <div class="text-5xl font-bold text-indigo-900" id="question-display">
                        --
                    </div>
                </div>

                <!-- アルファベット参照表（コンパクト化） -->
                <div class="mb-4 flex justify-center">
                    <table class="border-collapse border border-gray-300">
                        <tbody>
                            <tr>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">A</td>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">B</td>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">C</td>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">D</td>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">E</td>
                            </tr>
                            <tr>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">F</td>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">G</td>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">H</td>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">I</td>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">J</td>
                            </tr>
                            <tr>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">K</td>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">L</td>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">M</td>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">N</td>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">O</td>
                            </tr>
                            <tr>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">P</td>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">Q</td>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">R</td>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">S</td>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">T</td>
                            </tr>
                            <tr>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">U</td>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">V</td>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">W</td>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">X</td>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">Y</td>
                            </tr>
                            <tr>
                                <td class="h-7 w-12 border border-gray-300 text-center text-sm font-medium text-gray-700">Z</td>
                                <td class="h-7 w-12 border border-transparent"></td>
                                <td class="h-7 w-12 border border-transparent"></td>
                                <td class="h-7 w-12 border border-transparent"></td>
                                <td class="h-7 w-12 border border-transparent"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 回答入力＆ボタンエリア -->
                <div class="mb-2">
                    <label for="answer-input" class="sr-only">
                        あなたの答え:
                    </label>
                    <div class="flex gap-2 items-stretch">
                        <input
                            type="text"
                            id="answer-input"
                            class="flex-1 min-w-0 text-center text-2xl font-bold p-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 uppercase"
                            maxlength="1"
                            autocomplete="off"
                        >
                        <button
                            id="submit-button"
                            class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-5 rounded-lg transition-colors duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed whitespace-nowrap min-w-[80px]">
                            <span class="text-lg">➤</span>
                        </button>
                        <button
                            id="next-button"
                            class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-5 rounded-lg transition-colors duration-200 hidden whitespace-nowrap min-w-[80px]">
                            <span class="text-lg">→</span>
                        </button>
                    </div>
                </div>

                <!-- フィードバックエリア（インライン表示） -->
                <div id="feedback" class="hidden rounded-lg p-2 text-center font-bold"></div>
            </div>

            <!-- ヒント（ドリル中は非表示） -->
            <div id="hint" class="hidden bg-blue-50 border-l-4 border-blue-400 p-4 mt-4">
                <div class="flex">
                    <div class="text-2xl mr-3">💡</div>
                    <div>
                        <p class="font-bold text-blue-800 mb-1">変換ルール</p>
                        <p class="text-sm text-blue-700">
                            1→A, 2→B, 3→C, 4→D, 5→E ... 26→Z<br>
                            参照表を見ながら位置で覚えましょう
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- フィードバックモーダル -->
    <div id="feedback-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
        <div class="absolute inset-0 bg-black/20"></div>
        <div class="relative bg-white rounded-2xl shadow-2xl p-8 mx-4 max-w-sm w-full text-center">
            <div id="modal-message" class="text-3xl font-bold mb-4"></div>
            <div id="modal-hint" class="hidden text-xl text-indigo-900 mb-4"></div>
            <div class="text-sm text-gray-400 mt-6">タップして次へ</div>
        </div>
    </div>

    <!-- スクリプト -->
    <script src="../js/common.js"></script>
    <script src="../js/drill-controller.js"></script>
    <script src="../js/123-abc.js"></script>
    <script>
        // ドリルを初期化
        const drill = new NumberToAlphaDrill();
        const controller = new DrillController(drill, {
            autoUppercase: true,
            maxLength: 1,
            placeholder: '答えを入力',
            getHintContent: (question, answer) => `${answer} = ${question}`
        });
    </script>
</body>
</html>
